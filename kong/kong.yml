_format_version: "1.1"

services:
  - name: auth-v1
    url: http://gotrue:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true

  - name: rest-v1
    url: http://postgrest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true

  - name: realtime-v1
    url: http://host.docker.internal:4000/socket/
    routes:
      - name: realtime-v1-all
        strip_path: true
        # Realtime resolves its tenant from the first label of the Host
        # header it receives (see docs on PLAYGROUND_TENANT_ID="localhost"
        # in multigres-playground.sh). Without preserve_host, Kong rewrites
        # the upstream Host header to this service's own host
        # (host.docker.internal), so Realtime would see tenant "host"
        # instead of "localhost" and reject every connection.
        preserve_host: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          # Unlike GoTrue/PostgREST, Realtime does its own independent
          # apikey/JWT check — it needs to see the apikey Kong's key-auth
          # already validated, not have it stripped (matches supabase's
          # own self-hosted kong.yml, which also sets this false only for
          # the realtime-v1 route).
          hide_credentials: false

  # Realtime's REST-style API (e.g. POST .../api/broadcast, used by
  # supabase-js's non-WebSocket broadcast path) — separate from the
  # WebSocket route above, matching real self-hosted supabase's kong.yml
  # (services realtime-v1-ws / realtime-v1-rest).
  - name: realtime-v1-rest
    url: http://host.docker.internal:4000/api/
    routes:
      - name: realtime-v1-rest-all
        strip_path: true
        preserve_host: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false

consumers:
  - username: anon-key
    keyauth_credentials:
      - key: ${ANON_JWT}
  - username: service-key
    keyauth_credentials:
      - key: ${SERVICE_JWT}
